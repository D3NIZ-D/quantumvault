[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumvault"
version = "1.0.0"
description = "Local, quantum-resistant password generator with an encrypted vault and web dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "cryptography>=42",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quantumvault = "quantumvault.__main__:main"

[tool.setuptools.packages.find]
include = ["quantumvault*"]

[tool.setuptools.package-data]
quantumvault = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
